<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Transaction Risk Investigation</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --border: #e6e8f0;
      --text: #1a2035;
      --muted: #6b7385;
      --accent: #3a5ded;
      --accent-soft: #eef1ff;
      --clean: #1f9d55;
      --clean-bg: #eaf7ee;
      --clean-border: #cdecd9;
      --flag: #b8790a;
      --flag-bg: #fdf3e0;
      --flag-border: #f3ddad;
      --shadow: 0 1px 2px rgba(20, 25, 45, .04), 0 4px 16px rgba(20, 25, 45, .05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 280px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      padding: 12px 8px;
    }

    .sidebar-header {
      padding: 12px 12px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .customer {
      padding: 14px 16px;
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background .15s ease, transform .1s ease;
      margin-bottom: 4px;
    }

    .customer:hover {
      background: #f1f3fa;
    }

    .customer.active {
      background: var(--accent-soft);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #c7cbdb;
      transition: background .2s;
    }

    .dot.clean {
      background: var(--clean);
    }

    .dot.flag {
      background: var(--flag);
    }

    .cname {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
    }

    .cid {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .main {
      flex: 1;
      overflow-y: auto;
      padding: 48px 64px;
      max-width: 1000px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      margin-top: 140px;
      font-size: 16px;
    }

    .breadcrumb {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .breadcrumb-sep {
      color: #c7cbdb;
    }

    .breadcrumb-current {
      color: var(--accent);
      font-weight: 600;
    }

    h1.page-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 32px;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .verdict {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 32px;
      border-radius: 12px;
      margin-bottom: 40px;
      border: 1px solid;
      box-shadow: var(--shadow);
    }

    .verdict.clean {
      background: var(--clean-bg);
      border-color: var(--clean-border);
    }

    .verdict.flag {
      background: var(--flag-bg);
      border-color: var(--flag-border);
    }

    .verdict-badge {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .verdict.clean .verdict-badge {
      background: var(--clean);
      color: #fff;
    }

    .verdict.flag .verdict-badge {
      background: var(--flag);
      color: #fff;
    }

    .verdict-text {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
    }

    .narrative {
      font-size: 15px;
      line-height: 1.7;
      color: #2c3245;
      white-space: pre-wrap;
      margin-bottom: 32px;
    }

    details.findings-container {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    summary.section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 0;
      padding: 18px 24px;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fbfbfc;
      transition: background 0.2s;
    }

    summary.section-title:hover {
      background: #f1f3fa;
    }

    summary.section-title::-webkit-details-marker {
      display: none;
    }

    summary.section-title::before {
      content: '▸';
      font-size: 15px;
      transition: transform 0.2s ease;
      color: #a0a6b5;
    }

    details[open] summary.section-title::before {
      transform: rotate(90deg);
    }
    
    details[open] summary.section-title {
      border-bottom: 1px solid var(--border);
    }

    .findings-list {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .finding {
      background: #fbfbfc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }

    .finding-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .rule-name {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
    }

    .evidence {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .txn-chip {
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      background: #ebedf5;
      border: 1px solid #d1d6eb;
      color: #2b4acb;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .finding-facts {
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
      line-height: 1.6;
      background: #f4f5fa;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .loading,
    .error {
      color: var(--muted);
      padding: 20px 4px;
      font-size: 15px;
    }

    .error {
      color: #c0392b;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      display: inline-block;
      animation: spin .7s linear infinite;
      margin-right: 10px;
      vertical-align: -3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .fade-out-content > * {
      opacity: 0 !important;
      transition: opacity 150ms ease-out;
    }

    .animate-slide-up {
      opacity: 0;
      animation: slideUpFadeIn 250ms ease-out forwards;
    }
    
    .animate-scale-in {
      opacity: 0;
      animation: scaleInFade 250ms ease-out forwards;
    }

    @keyframes slideUpFadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes scaleInFade {
      0% { opacity: 0; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-header">Customers</div>
      <div id="customerList">
        <div class="loading"><span class="spinner"></span>Loading...</div>
      </div>
    </div>
    <div class="main" id="main">
      <div class="empty">Select a customer to view their investigation report.</div>
    </div>
  </div>

  <script>
    // ---- Adjust these 4 lines if your API response shapes differ ----
    const CUSTOMERS_ENDPOINT = () => `/api/customers`;                  // expects [{id or customer_id, name}]
    const REPORT_ENDPOINT = id => `/api/customers/${id}/report`;      // expects {verdict, findings, narrative}
    const FINDINGS_KEY = 'findings';
    const NARRATIVE_KEY = 'narrative';
    // -------------------------------------------------------------------

    let customers = [];
    let activeId = null;

    async function loadCustomers() {
      try {
        const res = await fetch(CUSTOMERS_ENDPOINT());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        customers = await res.json();
        renderCustomerList();
      } catch (e) {
        document.getElementById('customerList').innerHTML =
          `<div class="error">Couldn't load customers: ${e.message}</div>`;
      }
    }

    function renderCustomerList() {
      const list = document.getElementById('customerList');
      list.innerHTML = '';
      customers.forEach(c => {
        const id = c.id ?? c.customer_id;
        const name = c.name ?? id;
        const div = document.createElement('div');
        div.className = 'customer' + (id === activeId ? ' active' : '');
        div.innerHTML = `<span class="dot" data-dot="${id}"></span>
                      <div><div class="cname">${name}</div><div class="cid">${id}</div></div>`;
        div.onclick = () => selectCustomer(id);
        list.appendChild(div);
      });
    }

    async function selectCustomer(id) {
      activeId = id;
      renderCustomerList();
      const main = document.getElementById('main');
      
      main.classList.add('fade-out-content');
      
      const req = fetch(REPORT_ENDPOINT(id));
      let fetchDone = false;
      req.then(() => fetchDone = true).catch(() => fetchDone = true);
      
      await new Promise(r => setTimeout(r, 150));
      
      if (!fetchDone) {
        main.classList.remove('fade-out-content');
        main.innerHTML = `<div class="loading animate-slide-up"><span class="spinner"></span>Running investigation...</div>`;
      }
      
      try {
        const res = await req;
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const report = await res.json();
        main.classList.remove('fade-out-content');
        renderReport(report, id);
      } catch (e) {
        main.classList.remove('fade-out-content');
        main.innerHTML = `<div class="error animate-slide-up">Failed to load report: ${e.message}</div>`;
      }
    }

    function renderReport(report, id) {
      const findings = report[FINDINGS_KEY] || [];
      const triggered = findings.filter(f => f.triggered !== false);
      const isClean = triggered.length === 0;
      const verdictText = report.verdict || (isClean ? 'No findings — history is consistent with established pattern.' : `${triggered.length} finding(s) identified.`);
      
      const customer = customers.find(c => (c.id ?? c.customer_id) === id);
      const customerName = customer ? (customer.name ?? id) : id;

      const dot = document.querySelector(`[data-dot="${id}"]`);
      if (dot) dot.className = 'dot ' + (isClean ? 'clean' : 'flag');

      let html = `
    <div class="breadcrumb animate-slide-up">Customers <span class="breadcrumb-sep">/</span> <span class="breadcrumb-current">${customerName}</span></div>
    <h1 class="page-title animate-slide-up" style="animation-delay: 20ms">Investigation Report</h1>
    
    <div class="verdict ${isClean ? 'clean' : 'flag'} animate-scale-in" style="animation-delay: 40ms">
      <span class="verdict-badge">${isClean ? 'Clean' : 'Review'}</span>
      <span class="verdict-text">${verdictText}</span>
    </div>`;

      if (report[NARRATIVE_KEY]) {
        html += `<div class="narrative animate-slide-up" style="animation-delay: 60ms">${escapeHtml(report[NARRATIVE_KEY])}</div>`;
      }

      if (triggered.length) {
        html += `<details class="findings-container animate-slide-up" style="animation-delay: 80ms">
          <summary class="section-title">Structured Findings Data (${triggered.length})</summary>
          <div class="findings-list">`;
        triggered.forEach((f, index) => {
          const evidence = f.evidence || f.evidence_ids || f.transactions || [];
          const delay = 100 + (index * 40);
          html += `<div class="finding animate-slide-up" style="animation-delay: ${delay}ms">
        <div class="finding-head"><span class="rule-name">${f.rule_id || f.rule || 'Finding'}</span></div>
        ${f.summary || f.reason ? `<div>${escapeHtml(f.summary || f.reason)}</div>` : ''}
        ${evidence.length ? `<div class="evidence">${evidence.map(t => `<span class="txn-chip">${t}</span>`).join('')}</div>` : ''}
        ${f.summary_facts ? `<div class="finding-facts">${escapeHtml(JSON.stringify(f.summary_facts))}</div>` : ''}
      </div>`;
        });
        html += `</div></details>`;
      }

      document.getElementById('main').innerHTML = html;
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.innerText = str;
      return d.innerHTML;
    }

    loadCustomers();
  </script>
</body>

</html>
