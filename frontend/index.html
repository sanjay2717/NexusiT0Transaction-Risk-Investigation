<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Transaction Risk Investigation Assistant</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .sidebar {
            width: 300px;
            border-right: 1px solid #ccc;
            padding-right: 20px;
        }

        .content {
            flex-grow: 1;
        }

        .customer-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            cursor: pointer;
            text-align: left;
            background: #eee;
            border: none;
            border-radius: 4px;
        }

        .customer-btn:hover {
            background: #ddd;
        }

        .verdict {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: sans-serif;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <h1>Transaction Risk Investigation Assistant</h1>
    <div class="container">
        <div class="sidebar">
            <h3>Customers</h3>
            <div id="customer-list">Loading...</div>
        </div>
        <div class="content">
            <h3 id="report-title">Select a customer to view report</h3>
            <div id="report-content" style="display: none;">
                <div id="verdict" class="verdict"></div>
                <div id="narrative-container">
                    <h4>Narrative</h4>
                    <pre id="narrative"></pre>
                </div>
            </div>
            <div id="loading" style="display: none;">Generating report...</div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>

</html>
